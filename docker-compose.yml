services:
  backend:
    build:
      context: .
      args:
        APP_UID: "${FOOTBALL_UID:-1000}"
        APP_GID: "${FOOTBALL_GID:-1000}"
    command: uvicorn football_intelligence.api:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      FOOTBALL_DATA_ROOT: /app/data
      FOOTBALL_OBJECT_STORE_BACKEND: s3
      FOOTBALL_DATABASE_URL: "${FOOTBALL_DATABASE_URL:?set FOOTBALL_DATABASE_URL to the PostgreSQL application URL}"
      FOOTBALL_S3_ENDPOINT_URL: http://minio:9000
      FOOTBALL_S3_PUBLIC_ENDPOINT_URL: "http://127.0.0.1:${FOOTBALL_MINIO_PORT:-9010}"
      FOOTBALL_S3_ACCESS_KEY: "${FOOTBALL_S3_ACCESS_KEY:?set a non-root MinIO application access key}"
      FOOTBALL_S3_SECRET_KEY: "${FOOTBALL_S3_SECRET_KEY:?set a non-root MinIO application secret key}"
      FOOTBALL_S3_BUCKET: "${FOOTBALL_S3_BUCKET:-football-media}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FOOTBALL_BACKEND_PORT:-8010}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football_app
      POSTGRES_PASSWORD: "${FOOTBALL_POSTGRES_PASSWORD:?set the PostgreSQL application password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football_app -d football"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        APP_UID: "${FOOTBALL_UID:-1000}"
        APP_GID: "${FOOTBALL_GID:-1000}"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      FOOTBALL_DATABASE_URL: "${FOOTBALL_DATABASE_URL:?set FOOTBALL_DATABASE_URL to the PostgreSQL application URL}"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${FOOTBALL_MINIO_ROOT_USER:?set a MinIO root user for local provisioning}"
      MINIO_ROOT_PASSWORD: "${FOOTBALL_MINIO_ROOT_PASSWORD:?set a MinIO root password for local provisioning}"
    ports:
      - "127.0.0.1:${FOOTBALL_MINIO_PORT:-9010}:9000"
      - "127.0.0.1:${FOOTBALL_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 20

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${FOOTBALL_MINIO_ROOT_USER:?set a MinIO root user for local provisioning}"
      MINIO_ROOT_PASSWORD: "${FOOTBALL_MINIO_ROOT_PASSWORD:?set a MinIO root password for local provisioning}"
      FOOTBALL_S3_ACCESS_KEY: "${FOOTBALL_S3_ACCESS_KEY:?set a non-root MinIO application access key}"
      FOOTBALL_S3_SECRET_KEY: "${FOOTBALL_S3_SECRET_KEY:?set a non-root MinIO application secret key}"
      FOOTBALL_S3_BUCKET: "${FOOTBALL_S3_BUCKET:-football-media}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${FOOTBALL_S3_BUCKET}"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::%s","arn:aws:s3:::%s/*"]}]}' "$${FOOTBALL_S3_BUCKET}" "$${FOOTBALL_S3_BUCKET}" > /tmp/upload-policy.json
        mc admin policy create local football-uploads /tmp/upload-policy.json
        mc admin user add local "$${FOOTBALL_S3_ACCESS_KEY}" "$${FOOTBALL_S3_SECRET_KEY}"
        mc admin policy attach local football-uploads --user "$${FOOTBALL_S3_ACCESS_KEY}"

  ui:
    build:
      context: .
      args:
        APP_UID: "${FOOTBALL_UID:-1000}"
        APP_GID: "${FOOTBALL_GID:-1000}"
    command: streamlit run src/football_intelligence/ui.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FOOTBALL_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FOOTBALL_UI_PORT:-8510}:8501"
    volumes:
      - ./data:/app/data

volumes:
  minio-data:
  postgres-data:
