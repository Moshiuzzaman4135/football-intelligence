[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "football-intelligence"
version = "0.1.0"
description = "Evidence-backed football video intelligence showcase"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Moshiuzzaman Shatil" }]
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.41,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
ml = ["ultralytics>=8.3,<9"]

[project.scripts]
football-intelligence = "football_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/football_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises video/media boundaries",
  "ml: downloads or runs optional ML weights",
  "gpu: requires a CUDA-capable runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
